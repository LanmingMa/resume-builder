同。",["3f65dbe5241c81d89007f746f60af032","3f65dbe5241c8109aacdd4e352d1c6ce"]],["面试工作流","先讲业务目标和 trade-offs，再讲指标口径、分析或实验、结果与 next decision。将 Clean Room 和 Ads Staples 各准备 90 秒、5 分钟和深挖技术版本。","公开面经涉及实验、free trial、product sense、SQL/Python，但匿名面经不能当官方题库。",["3f65dbe5241c81f0a42aed8b5f236503","3f75dbe5241c811b852bc91649ad3bf2","4005dbe5241c819a9eb7e3623bbd9f6a"]]],"sourceIds":["3f65dbe5241c8109aacdd4e352d1c6ce","3f65dbe5241c81d89007f746f60af032","3f65dbe5241c81f0a42aed8b5f236503","3f65dbe5241c8142bac3fb2f62b83a2d","3f75dbe5241c811b852bc91649ad3bf2","4005dbe5241c819a9eb7e3623bbd9f6a"],"extraIds":["3f75dbe5241c81f89e7bca2c026fd244","3f75dbe5241c81bf9c78f66614275954"]},{"id":"marketplace","n":"02","title":"Ads 产品 & 市场","english":"Marketplace","short":"平台怎么增长、怎么赚钱","lead":"合并官方发布、广告市场演进、广告负载、行业差异和用户体验的研究线索。","focal":"Ads Manager · Demand Health · AirOps 观测","icon":"◈","tabs":["概览","产品时间线","数据探索","指标体系","来源"],"chapters":[["从试验到可运营平台","研究记录串起美国广告测试、自助 Ads Manager、Pixel/CAPI、官方测量合作及国际化。广告业务从“能买”过渡到“能验证价值并扩量”。","这些是公开业务动作，不能据此推断每一个能力都已全面上线。",["3f65dbe5241c81a09514d34de2f52707","4005dbe5241c81a0a998c52395f8e171"]],["第三方信号显示广告密度上升","AirOps 对配对问题的采样显示：含广告回答占比 36.1%→39.9%，distinct advertisers per question 1.82→2.14。","这些不等于整个 ChatGPT 流量真实 ad load，更不等于 CTR、收入或因果增量。图表 across-sector 38.7% 与配对样本 39.9% 不可混算。",["4055dbe5241c81d1be02d733dbd78712"]],["双边 Marketplace 决策","广告主需要 volume、relevance、delivery、可信测量；用户需要有帮助且不会被广告污染的回答。","对 Demand DS 来说，广告密度、供需集中度、广告主留存与体验 guardrail 要一起监控，避免单一 CTR 驱动。",["3f65dbe5241c81a09514d34de2f52707","3fb5dbe5241c813698dfe65a57ba95af","4055dbe5241c81d1be02d733dbd78712"]]],"sourceIds":["3f65dbe5241c81a09514d34de2f52707","4005dbe5241c81a0a998c52395f8e171","3fb5dbe5241c813698dfe65a57ba95af","4055dbe5241c81d1be02d733dbd78712"],"extraIds":["3f75dbe5241c81378a95ded57261bffc","3fd5dbe5241c81528018cb33c7083b68","3f75dbe5241c81dbac0fffb2b8c3f093"]},{"id":"measurement","n":"03","title":"Measurement & Growth","english":"Measurement","short":"归因、增量、信号与 ROI","lead":"不再分散在 LiveRamp、WorkMagic、AppsFlyer、帖子和履历中；统一成从信号到增量证明的测量链路。","focal":"CAPI / EQS → Attribution → Geo Lift → Budget","icon":"⌁","tabs":["概览","测量链路","案例拆解","实验练习","来源"],"chapters":[["第一方信号是可信测量的起点","Pixel/CAPI、identity matching、event quality / coverage、dedup 与隐私约束共同决定 measurement 能否成立。","Pinterest clean room / EQS 是你的可迁移经验；不能写成 OpenAI × LiveRamp 已经有相同 clean-room 产品。",["3f75dbe5241c811b852bc91649ad3bf2","3f75dbe5241c818a9c32f345ff3d4878"]],["Attribution 不等于 Incrementality","MMP 和 last-click 用于观测/分配 credit；geo-lift、随机 holdout 回答“如果不投，这些结果还会发生吗”。","归因 CPA、增量订单、新客订单占比、新访客占比四种指标在面试中必须拆开。",["4025dbe5241c810f9ea2f2aac4f12005","3f75dbe5241c818a9c32f345ff3d4878"]],["证明价值才能获得长期预算","Agency 的预算提升需要 first signal → first attributable outcome → causal validation → scalable decision。","可能的 DS 任务包括信号健康告警、实验设计、不同测量口径 reconciliation 和广告主预算扩张预测；均为面试推演而非内部 roadmap。",["3f75dbe5241c81dbac0fffb2b8c3f093","4025dbe5241c810f9ea2f2aac4f12005","3f75dbe5241c818a9c32f345ff3d4878"]]],"sourceIds":["3f75dbe5241c81dbac0fffb2b8c3f093","4025dbe5241c810f9ea2f2aac4f12005","3f75dbe5241c818a9c32f345ff3d4878"],"extraIds":["3f75dbe5241c811b852bc91649ad3bf2","3f65dbe5241c81a09514d34de2f52707","3f65dbe5241c8138a7a9dba7920a1b23","4055dbe5241c81d1be02d733dbd78712"]},{"id":"people","n":"04","title":"People & Relationships","english":"People","short":"谁在做什么、真实关系是什么","lead":"把 DS peers、Ads leadership、Marketing Science、合作方和 LinkedIn 人脉放进一张可筛选的人物网络。","focal":"公开确认 · 职能关联 · 未核实关系分开","icon":"◉","tabs":["概览","关系网络","人物目录","合作线索","来源"],"chapters":[["从角色而非“名人”理解组织","Ads DS / Marketing Science / Ads Solutions / Partnerships / Strategic Finance 解决不同问题。候选 peer 不等于直属同事；活动互动也不证明组织关系。","Kayla 本人公开确认领导 Ads Data Science，但对具体直属 IC 名单，已有研究仍保留未核实标记。",["3f75dbe5241c81f89e7bca2c026fd244","3f75dbe5241c81bf9c78f66614275954"]],["招人和面试中的一阶网络","Kayla 对 Ads DS 经验提出明确需求；Marketing Science 的 Sam Mulinder、Christopher Flexner 带来测量经验；GTM 的 David Dugan、Mitch Pilar 更贴近销售与客户场景。","相邻人员可提供产品背景线索，但“可能合作”不能升级成“已确认 reporting line”。",["3f75dbe5241c81378a95ded57261bffc"," xel / Conversions API · first-party event ingestion","先确保 conversion event 的定义、采集窗口、隐私/同意与权限正确；信号缺失会让后续测量有系统性偏差。"],["Quality","Quality & match","EQS / UMCS · dedup · match confidence","同一事件可能漏传、重复或匹配错误。monitor coverage / identity matching / duplication；注意 EQS/UMCS 是你 Pinterest 的经历，不代表 OpenAI 官方命名。"],["Attribution","Credit assignment","MMP / click & view-through / reporting","归因告诉你哪些广告被计入结果，不天然回答是否带来“如果不投就不会发生”的增量。"],["Incrementality","Causal validation","Randomized holdout / geo-lift / MMM triangulation","对照组、跨渠道溢出、样本量、季节性和 power 决定增量结论是否可信。"],["Scale","Budget decision","iROAS / incremental CAC / net-new customers","把可信增量结论与 advertiser unit economics 联系起来，决定增投、续投或调整产品。"]],"cases":[["WeightWatchers","−15.3%","Attributed CPA vs blended paid-search benchmark","归因效率比较，不等于随机试验验证的 incremental CPA。","4025dbe5241c810f9ea2f2aac4f12005"],["Dose × WorkMagic","67%","Share of incremental purchases from net-new customers","新客占增量订单的比例，不等于购买量增长 67%；属于具体 geo-lift 案例。","4025dbe5241c810f9ea2f2aac4f12005"],["Portland Leather","93%","New visitors among ChatGPT Ads-sourced visitors","是 new visitors，不是新购买客户，也不等于 93% 因果增量。","4025dbe5241c810f9ea2f2aac4f12005"],["AirOps external panel","36.1→39.9%","Ad-bearing answers, same prompt panel (Aug→Oct)","+3.8 percentage points；第三方配对 prompt 样本，不是平台整体收入或广告 CTR。","4055dbe5241c81d1be02d733dbd78712"]],"questions":[["Ads Demand","ROAS 下滑时，如何排除 signal loss？","先拆 ROAS 分子分母与 attribution window；按 advertiser cohort / region / campaign 检查 delivery、conversion visibility、dedup、match rate、预算消耗；再区分真实效果下降和 measurement artifact。"],["Ads Demand","如何判断一个 answer 应展示 1 个还是 2 个广告主？","明确双边目标：incremental advertiser value + user guardrails；实验随机化、竞争挤出、advertiser diversity、长期满意度和 latency。"],["SMB Ads Growth","注册上涨，first campaign launch 下跌怎么办？","定义 funnel event taxonomy；按 acquisition source / geo / cohort 识别 friction；基于 A/B 设计 onboarding、ROI proof 与 signal install 测试。"],["Measurement","last-click ROAS 很高，如何确认预算值得扩？","先解释 attribution != causality；设计 geo-holdout/随机实验，检验 selecti conversion event ingestion"],["Attribution / MMP",["AppsFlyer","Triple Whale","Adjust","Rockerbox","Northbeam","Branch","Singular","Kochava","Airbridge","Tenjin"],"click/view attribution & reporting"],["Incrementality / lift",["Haus","Measured","WorkMagic","INCRMNTAL","Fospha"],"geo lift、causal experiments 或 advanced full-funnel（各家公司具体能力不同）"],["Suitability & brand",["DoubleVerify","Integral Ad Science (IAS)","Kantar","Cint"],"brand suitability 与 brand resonance（部分试点性质）"],["Activation / agencies",["Adobe","Criteo","Kargo","Pacvue","StackAdapt","Dentsu","Omnicom","Publicis","WPP"],"买量、commerce integration、agency buying / creative"]],"origins":[["Meta Ads","Kayla Reinherz · David Dugan · Benji Shomair","Ads DS / Monetization / GTM"],["Snap","Sam Mulinder · Christopher Flexner","Marketing Science"],["Google Ads","Mitch Pilar 与相关 GTM 人才背景","Intent / Ads Solutions"],["LinkedIn Marketing Solutions","B2B advertising / GTM 人才研究线索","B2B Sales & marketing"]],"companies":[["Meta","Talent origin"],["Snap","Talent origin"],["Google Ads","Talent origin"],["LinkedIn","Talent origin"],["LiveRamp","Signals"],["Hightouch","Signals"],["Tealium","Signals"],["AppsFlyer","Attribution"],["Triple Whale","Attribution"],["Rockerbox","Attribution"],["Haus","Incrementality"],["Measured","Incrementality"],["WorkMagic","Incrementality"],["DoubleVerify","Brand safety"],["IAS","Brand safety"],["Adquadrant","Agency"],["AirOps","External intelligence"],["Stacker","GEO / publishing"],["Profound","AI-native marketing"],["Evertune","AI-native marketing"],["Criteo","AdTech"],["Pacvue","AdTech"],["StackAdapt","AdTech"],["Amazon Ads","Competitor"],["TikTok Ads","Competitor"],["Pinterest Ads","Competitor"],["Reddit Ads","Competitor"],["Databricks","Applied AI"],["Anduril","Applied AI"],["Scale AI","Applied AI"],["Reflection AI","Applied AI"],["Higgsfield","Consumer AI"],["Replit","Consumer AI"],["Perplexity","Consumer AI"],["Lovable","Consumer AI"],["Anthropic","Frontier AI"],["Sierra","Applied AI"],["Harvey","Applied AI"]],"careerCompanies":[["Consumer AI","OpenAI, Anthropic, Canva, Superhuman, Higgsfield, Replit, Suno, Lovable, Perplexity, ElevenLabs, Midjourney, OpenRouter, Figma, Notion, Manus, HeyGen, Runway, Cognition"],["Applied / Infra","Databricks, Anduril, Project Prometheus, Figure AI, SSI, Scale AI, Reflection AI, Etched, Fireworks AI, Sierra, Harvey, OpenEvidence, Applied Intuition, Skild AI, Baseten, Shield AI"],["AI-native marketing","Profound, Evertune, AirOps and other GEO / AI Search measurement companies"]],"shared":["4045dbe5241c80fbad74c542d9d1bf2f","3f75dbe5241c81d4af23c7eab8eddb57","3f65dbe5241c8138a7a9dba7920a1b23","4025dbe5241c811fb0faf40181d71d91"]}</script>
<script>
(function(){'use strict';const data=JSON.parse(document.getElementById('atlas-data').textContent);const {pages,topics,roles,events,sectors,measureSteps,cases,questions,people,edges,partners,origins,companies,careerCompanies,shared}=data;const byId=Object.fromEntries(pages.map(p=>[p.id,p]));const topicMap=Object.fromEntries(topics.map(t=>[t.id,t]));const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const es=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},put:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};function read(key,fallback){try{return JSON.parse(store.get(key)||'null')??fallback}catch(e){return fallback}}let state={route:'home',tab:{},role:'demand',step:0,caseIndex:0,flash:0,flip:false,graph:'OpenAI Ads',edgeFilter:'all',personFilter:'All',personTerm:'',companyFilter:'All',companyTerm:'',partnerFilter:'All',sortSectors:'desc',notes:read('atlas-v2-notes',{}),checked:read('atlas-v2-checks',{}),seen:read('atlas-v2-seen',{}),theme:store.get('atlas-v2-theme')==='dark'};const defaultTab=t=>t.tabs[0];const selectedTab=t=>state.tab[t.id]||defaultTab(t);function save(){store.put('atlas-v2-notes',JSON.stringify(state.notes));store.put('atlas-v2-checks',JSON.stringify(state.checked));store.put('atlas-v2-seen',JSON.stringify(state.seen))}function source(id){return byId[id]}function srcPills(ids){return `<div class="source-pills">${ids.map(id=>byId[id]?`<a class="source-pill" title="${es(byId[id].title)}" href="${es(byId[id].url)}" target="_blank" rel="noopener noreferrer">↗ ${es(byId[id].short.slice(0,30))}</a>`:'').join('')}</div>`}function top(ids){return ids.map(id=>byId[id]).filter(Boolean)}function btn(text,act,value='',cls=''){return `<button class="btn ${cls}" data-${act}="${es(value)}">${text}</button>`}function link(id,text){return byId[id]?`<a href="${es(byId[id].url)}" target="_blank" rel="noopener noreferrer">${es(text)}</a>`:''}function nav(){let out=topics.map(t=>`<button class="side-link ${state.route===t.id?'active':''}" data-route="${t.id}"><span class="side-icon">${t.icon}</span><span class="side-label">${es(t.title)}</span><span class="side-n">${String(t.n)}</span></button>`).join('');$('#topicnav').innerHTML=out;$$('.side-link').forEach(x=>x.classList.toggle('active',x.dataset.route===state.route))}function setRoute(r,tab){state.route=r;if(tab&&topicMap[r])state.tab[r]=tab;location.hash='#/'+r+(topicMap[r]?'/'+encodeURIComponent(selectedTab(topicMap[r])):'');$('#sidebar').classList.remove('open');render();window.scrollTo(0,0)}function parseHash(){let sp=decodeURIComponent(location.hash.replace(/^#\/?/,'')).split('/');if(!sp[0])return;if(sp[0] in topicMap&&sp[1])state.tab[sp[0]]=sp[1];state.route=sp[0]}function header(title,subtitle,eyebrow='RESEARCH DESK'){return `<div class="eyebrow">${es(eyebrow)}</div><h1>${title}</h1><div class="intro">${es(subtitle)}</div>`}function footer(){return `<footer class="footer"><span>OpenAI Research Atlas · Topic-first edition · Oct 26, 2026</span><span>32 curated source pages · Offline snapshot · Notion source links preserved</span></footer>`}
function home(){let cards=topics.map(t=>`<article class="topic-card" data-route="${t.id}" tabindex="0" role="button"><span class="over">${t.n} · ${es(t.english.toUpperCase())}</span><span class="glyph">${t.icon}</span><h3>${es(t.title)}</h3><p>${es(t.lead)}</p><footer><span>${t.sourceIds.length} 个主资料合并 · ${t.tabs.length} Tabs</span><span>进入主题 →</span></footer></article>`).join('');let insight=[['01','三份 JD 是三种不同的业务','Ads Demand 是平台广告主运营；SMB 是广告主获取；B2B Demand Gen 服务 OpenAI 自身企业营销。','applications','岗位对比'],['02','归因与增量必须分开','从 Pixel/CAPI → signal quality → attribution → geo-lift → incremental decision，在一个主题内连起来。','measurement','测量链路'],['03','人物关系按证据分级','公开同事、官方合作、评论互动与“业务相邻”不能画成同一种线。','people','关系网络']];return `<div class="hero-home"><div>${header('One topic.<br>One complete picture.','把原来 32 个分散 Notion 页面合成六个业务主题。每个主题再用多个 Tab 切换内容、图表、人物、案例和原始来源。','OPENAI / INTEGRATED RESEARCH ATLAS')}<div style="display:flex;gap:9px;flex-wrap:wrap">${btn('从求职准备开始 →','route','applications','primary')}${btn('探索 Measurement','route','measurement')}</div><div class="statrow"><span><b>6</b> Topics</span><span><b>32</b> Source pages</span><span><b>5</b> Interactive modules</span><span>截至 2026.10.26</span></div></div><div class="hero-note"><div><span class="eyebrow">DESIGN PRINCIPLE</span><div class="big">32 <em>→ 6</em></div><div class="tiny-line"></div><b>从“资料夹”变成“研究台”</b><p class="muted" style="font-size:13px">你看到的是合并后的结论。原始帖子、面经、合作伙伴页面放在对应主题的「来源」Tab，点开就能读摘要并跳 Notion。</p></div><div style="display:flex;gap:10px;align-items:center;color:var(--muted);font-size:11px"><span class="tag green">可离线使用</span><span>保留原始证据</span></div></div></div><div class="sectionlabel"><h2>六个完整工作台</h2><small>按要解决的问题进入，而不是按 Notion 子页面编号</small></div><div class="topic-grid">${cards}</div><div class="sectionlabel"><h2>最重要的三条研究线</h2><small>可直接打开对应 Tab</small></div><div class="pair" style="grid-template-columns:repeat(3,minmax(0,1fr))">${insight.map(x=>`<article class="keyline" data-goto="${x[3]}|${x[4]}" style="cursor:pointer"><div class="number">${x[0]}</div><div><strong>${x[1]}</strong><p>${x[2]}</p><span style="color:var(--accent);font-size:11px">查看专题 →</span></div></article>`).join('')}</div><div class="softwarn">这是基于已有 Notion 研究的 <strong>2026-10-26 静态快照</strong>。按主题整合了已整理的证据和精选重点，但不是全部 Notion 逐字全文，也不会自动同步。所有 32 个原始页面仍可在「来源资料库」打开。</div>${footer()}`}
function topicHero(t){return `<div class="topic-hero"><div><div class="eyebrow">WORKSTREAM ${t.n} / ${es(t.english.toUpperCase())}</div><h1>${es(t.title)}</h1><div class="intro" style="margin-bottom:7px">${es(t.lead)}</div><span class="focal">${es(t.focal)}</span></div><div class="sourcecount">${t.sourceIds.length} merged source pages<br>${t.tabs.length} tabs · linked to original Notion<br>${btn('查看全部来源 ↗','topic-tab',`${t.id}|来源`,'small')}</div></div><div class="tabbar" role="tablist" aria-label="${es(t.title)} tabs">${t.tabs.map(tab=>`<button role="tab" aria-selected="${selectedTab(t)===tab}" class="tab ${selectedTab(t)===tab?'active':''}" data-topic-tab="${t.id}|${es(tab)}">${es(tab)}</button>`).join('')}</div>`}
function chapters(t){return `<div class="leadcall"><strong>合并阅读</strong>　下面不是几个子页面的摘录拼接，而是围绕「${es(t.short)}」把相关研究串成一个论点。每一段都有对应的 Notion 来源。</div><div class="body-grid"><div class="main-body">${t.chapters.map((c,i)=>`<section class="chapter" id="chapter-${i}"><div class="chapter-num">INSIGHT ${String(i+1).padStart(2,'0')}</div><h2>${es(c[0])}</h2><p class="statement">${es(c[1])}</p><p class="next">${es(c[2])}</p>${srcPills(c[3])}</section>`).join('')}<div class="sectionlabel"><h2>下一步：进入具体工具</h2></div><div class="pair">${t.tabs.filter(x=>!['概览','来源'].includes(x)).slice(0,2).map(x=>`<div class="panel" data-topic-tab="${t.id}|${x}" style="cursor:pointer"><h3>${es(x)} →</h3><p>直接使用交互模块，不必跳出当前主题去找另一个 Notion 页面。</p></div>`).join('')}</div></div><aside class="sticky-side"><h4>本页目录</h4>${t.chapters.map((c,i)=>`<button data-scroll="chapter-${i}">${es(c[0])}</button>`).join('')}<div class="note">只合并主题相关证据。公开事实、第三方观测与面试推演仍明确区分。</div></aside></div>`}
function rolesView(){let r=roles.find(x=>x.id===state.role)||roles[0];return `<div class="sectionlabel"><h2>三个职位，三种决策问题</h2><small>点选职位后，下方的 metric、你的故事和模拟 case 同步切换</small></div><div class="role-compare">${roles.map(x=>`<div class="role-card ${r.id===x.id?'highlight':''}" style="cursor:pointer" data-role="${x.id}"><span class="tag ${r.id===x.id?'green':''}">${es(x.priority)}</span><h3>${es(x.name)}</h3><p class="muted" style="font-size:12px">${es(x.goal)}</p><dl><dt>服务对象</dt><dd>${es(x.customer)}</dd><dt>关键决策</dt><dd>${es(x.workflow)}</dd></dl></div>`).join('')}</div><div class="role-detail"><div class="eyebrow">SELECTED ROLE</div><h2>${es(r.name)}</h2><div class="metric-chips">${r.metrics.map(x=>`<span>${es(x)}</span>`).join('')}</div><h3 style="margin-top:19px">用你的哪段经历去证明？</h3><p class="muted">${es(r.experience)}</p><h3 style="margin-top:16px">模拟面试问题</h3><p>${es(r.case)}</p><div style="margin-top:18px;display:flex;gap:9px;flex-wrap:wrap"><a class="btn primary" href="${es(r.jd)}" target="_blank" rel="noopener noreferrer">查看官方 JD ↗</a>${btn('练这类面试题','topic-tab','applications|面试练习')}</div></div><div class="softwarn">排序反映你现有素材与职责的贴近程度，不是招聘内幕或录取概率。岗位是否仍开放，请以实际打开的官方 Careers 页面为准。</div>`}
function experienceView(){let arr=[['Amazon Ads','Measurement, Incrementality & GenAI','MMM / MTA / lift / ads economics / LLM ad workflows','证明深度理解广告主价值、因果测量与规模化业务。'],['Pinterest','Conversion Visibility & Marketplace','EQS / UMCS / match-quality waterfall / LiveRamp clean room / Ads Staples','证明能设计跨公司/跨工程的 trusted signals 和 operating metrics。'],['Microsoft','AI-native Evaluation & Product Metrics','LLM-as-judge / human validated diversity / ranking & monetization metrics','证明可以把传统 DS 框架带入 AI 产品的 evaluation 与 decision layer。']];return `<div class="sectionlabel"><h2>把分散的履历收敛成三个证据故事</h2><small>每个故事都可以复用到不同职位的面试</small></div><div class="call-list">${arr.map((x,i)=>`<article><div class="eyebrow">STORY 0${i+1} · ${es(x[0])}</div><h3>${es(x[1])}</h3><p><b>${es(x[2])}</b></p><p>${es(x[3])}</p></article>`).join('')}</div><div class="sectionlabel"><h2>两段 P0 深挖</h2></div><div class="pair"><div class="panel"><h3>Clean Room</h3><p>Pinterest × LiveRamp privacy-safe measurement：matching / offline attribution / SQL analytics / sales lift / audience overlap。</p><p><b>避免：</b>把你自己的 clean room 实现写成 OpenAI × LiveRamp 已落地的同一个产品。</p>${srcPills([data.pages.find(x=>x.id===`3f75dbe5241c811b852bc91649ad3bf2`).id])}</div><div class="panel"><h3>Ads Staples</h3><p>统一 operating system，贯穿 business → delivery → advertiser performance → supply / user guardrails。</p><p><b>突出：</b>能够让 Sales / Product / leadership 对指标体系有共同语言并形成行动。</p>${srcPills([`3f75dbe5241c811b852bc91649ad3bf2`])}</div></div><div class="softwarn">上述描述来自你已整理的事实底稿；履历中的部分影响数字仍需单独审查，不应将草稿数字自动当最终事实。</div>`}

function companyView(onlyApplied){let arr=onlyApplied?careerCompanies.map(x=>[x[0],x[1].split(', ').length,x[1]]):companies;let cat=onlyApplied?['All',...careerCompanies.map(x=>x[0])]:['All',...new Set(companies.map(x=>x[1]))];let res=onlyApplied?arr.filter(x=>state.companyFilter==='All'||x[0]===state.companyFilter).map(x=>[x[0]+' · '+x[1]+' companies',x[0],x[2]]):companies.filter(x=>(state.companyFilter==='All'||x[1]===state.companyFilter)&&x[0].toLowerCase().includes(state.companyTerm.toLowerCase())).map(x=>[x[0],x[1],'']);return `<div class="sectionlabel"><h2>${onlyApplied?'公司宇宙':'公司与生态筛选器'}</h2><small>${res.length} entries · research universe, not verified current vacancies</small></div><div class="filterbox">${onlyApplied?'':`<input class="input" id="companysearch" value="${es(state.companyTerm)}" placeholder="搜索公司…">`}<select id="companycategory" class="input" style="flex:0 1 245px">${cat.map(x=>`<option ${state.companyFilter===x?'selected':''}>${es(x)}</option>`).join('')}</select></div><div class="tablewrap"><table><thead><tr><th>公司 / 组别</th><th>分类</th>${onlyApplied?'<th>包括的公司</th>':''}</tr></thead><tbody>${res.map(x=>`<tr><td><b>${es(x[0])}</b></td><td><span class="tag">${es(x[1])}</span></td>${onlyApplied?`<td>${es(x[2])}</td>`:''}</tr>`).join('')}</tbody></table></div><div class="softwarn">分类体现研究线索，与是否为 OpenAI 真实官方合作伙伴、是否在招聘、岗位是否合适必须分开核验。</div>`}
function careerView(){let a=[['近期','OpenAI Ads / Monetization DS','以信号、增量测量、广告主经济与经营 KPI 证明 impact。'],['中期','AI-native Ads / Applied AI','将 AI eval、agent workflow 与真实业务系统结合，找到可迁移的 deployment 和产品机会。'],['长期','Enterprise deployment / FDE / Field CTO','更贴近客户问题、跨部门部署与 AI 商业价值验证。']];return `<h2>职业路径：从深度领域走向部署领导力</h2><div class="eventline">${a.map((x,i)=>`<div class="event"><time>PHASE 0${i+1} · ${x[0]}</time><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div><div class="softwarn">这是保存在 Notion 的个人规划方向，而不是已经确定的职业轨迹或对未来岗位的承诺。</div>`}
function learningView(){let tasks=[['review','深入复盘两段 P0 广告经历：Clean Room & Ads Staples'],['case','为 Ads Demand / SMB Ads Growth 各准备一套可手写的指标树与因果实验'],['person','理解 Kayla、Marketing Science、GTM 各自职能边界'],['agent','总结 AI-native eval / agent workflow 的可复用产品案例'],['companies','从公司池中挑出目前真实在招且岗位匹配的 10 家，核验 JD']];return `<h2>从学习清单变成有完成状态的计划</h2><p class="muted">完成状态保存在这个浏览器本地，不修改 Notion。</p><div class="checklist">${tasks.map(t=>`<label class="checkrow ${state.checked['learning-'+t[0]]?'done':''}"><input data-check="learning-${t[0]}" type="checkbox" ${state.checked['learning-'+t[0]]?'checked':''}><span>${es(t[1])}</span></label>`).join('')}</div>`}
function sourcesView(t){let ids=[...new Set([...t.sourceIds,...t.extraIds])];return `<div class="sectionlabel"><h2>本主题的原始材料</h2><small>${t.sourceIds.length} 份主资料 + ${t.extraIds.length} 份相关材料 · 全部保留原始 Notion 入口</small></div><p class="muted">展开任何来源可直接阅读它的精选章节内容，而不需要回到 32 个单独页面找线索。</p><div class="sources">${ids.map(id=>sourceItem(byId[id],!t.sourceIds.includes(id))).join('')}</div>`}
function sourceItem(p,ref=false){if(!p)return '';return `<details class="source-item"><summary><div><strong>${es(p.title)}</strong><small>${es(ref?'相关材料 · ':'主资料 · ')}${es(p.desc)}</small></div><span class="date">${es(p.date)}　⌄</span></summary><div class="source-body">${p.blocks.map(b=>`<h4>${es(b.heading)}</h4><ul>${b.items.map(x=>`<li>${es(x)}</li>`).join('')}</ul>`).join('')}<div class="actions"><a class="btn small original" href="${es(p.url)}" target="_blank" rel="noopener noreferrer">Open full Notion ↗</a></div></div></details>`}
function topicContent(t){let tab=selectedTab(t);if(tab===t.tabs[0])return chapters(t);if(tab==='来源')return sourcesView(t);if(t.id==='applications'){if(tab==='岗位对比')return rolesView();if(tab==='我的经历')return experienceView();return interviewView('application')}if(t.id==='marketplace'){if(tab==='产品时间线')return timelineView();if(tab==='数据探索')return dataView();return metricView()}if(t.id==='measurement'){if(tab==='测量链路')return measurementStack();if(tab==='案例拆解')return caseView();return interviewView('measurement')}if(t.id==='people'){if(tab==='关系网络')return graph();if(tab==='人物目录')return peopleDirectory();return peopleLinks()}if(t.id==='ecosystem'){if(tab==='合作伙伴')return partnerView();if(tab==='人才来源')return originView();return companyView(false)}if(t.id==='applied'){if(tab==='职业路线')return careerView();if(tab==='公司宇宙')return companyView(true);return learningView()}return chapters(t)}
function topic(t){return topicHero(t)+`<div id="topic-content">${topicContent(t)}</div>${footer()}`}
function library(){let sorted=[...pages].sort((a,b)=>a.title.localeCompare(b.title));let out=topics.map(t=>`<div class="archive-topic" data-route="${t.id}"><strong>${t.icon}　${es(t.title)}</strong><small>${t.sourceIds.length} pages integrated →</small></div>`).join('');return `${header('来源资料库','这里保留 32 个原始 Notion 页面和全部精选摘要；日常阅读应从六个合并主题进入。','SOURCE LIBRARY / 32 DOCUMENTS')}<div class="archive-group">${out}</div><div class="sectionlabel"><h2>全部来源 · 可展开阅读</h2><small>按标题字母/中文排序；不是原来的文件夹视图</small></div><input id="library-search" class="input" placeholder="搜索标题、摘要、关键词、章节内容…"><div id="library-list" class="sources" style="margin-top:12px">${sorted.map(p=>sourceItem(p)).join('')}</div>${footer()}`}
function workspace(){let all=Object.values(state.checked).filter(Boolean).length;return `${header('我的研究进度','将经常练习的内容和自己的笔记集中起来，而不是散落在每个 Notion 页面。','YOUR PERSONAL WORKSPACE')}<div class="panel"><div class="eyebrow">LOCAL-ONLY STATE</div><h2>${all} 项已标记完成</h2><p>包括面试练习题和职业学习计划。不同浏览器之间不会自动同步。</p><div class="progress"><div style="width:${Math.min(all/13*100,100)}%"></div></div></div><div class="sectionlabel"><h2>六个主题的阅读笔记</h2><small>自动保存到当前浏览器</small></div>${topics.map(t=>`<div class="panel" style="margin-bottom:13px"><h3>${es(t.title)}</h3><textarea class="notebox" data-note="${t.id}" placeholder="在这里写下你的判断、要问的问题、下一步…">${es(state.notes[t.id]||'')}</textarea></div>`).join('')}<div style="display:flex;gap:10px;flex-wrap:wrap">${btn('导出笔记与进度 JSON','export','yes','primary')}${btn('返回研究总览','route','home')}</div><div class="softwarn">本地 HTML 不会更改你的 Notion 内容。导出的 JSON 可用于备份，但不是同步服务。</div>${footer()}`}
function render(){nav();$('#breadcrumb-title').textContent=state.route==='home'?'Research Atlas':state.route==='library'?'Source Library':state.route==='workspace'?'My Workspace':topicMap[state.route]?.title||'Research Atlas';$('#main').innerHTML=state.route==='home'?home():state.route==='library'?library():state.route==='workspace'?workspace():topicMap[state.route]?topic(topicMap[state.route]):home();if(state.route==='library')bindLibrarySearch()}
function bindLibrarySearch(){let inp=$('#library-search');inp.addEventListener('input',()=>{let q=inp.value.trim().toLowerCase();let list=pages.filter(p=>[p.title,p.desc,p.tags.join(' '),p.blocks.map(b=>b.heading+' '+b.items.join(' ')).join(' ')].join(' ').toLowerCase().includes(q));$('#library-list').innerHTML=list.length?list.map(p=>sourceItem(p)).join(''):'<div class="empty">没有匹配结果</div>'})}
function flashChange(delta){let scope=state.route==='measurement'?'measurement':'application';let ids=questions.map((x,i)=>i).filter(i=>scope!=='measurement'||['Measurement','Ads Demand','AI / Measurement'].includes(questions[i][0]));let at=ids.indexOf(state.flash);state.flash=ids[(at+delta+ids.length)%ids.length];state.flip=false;render()}
function setState(k,value){state[k]=value;render()}function search(open){$('#search-layer').classList.toggle('open',open);if(open){$('#search-input').value='';searchResults('');$('#search-input').focus()}}
function searchResults(query){let q=query.toLowerCase().trim();let results=[];topics.forEach(t=>{let text=[t.title,t.english,t.lead,t.focal,...t.chapters.flatMap(c=>[c[0],c[1],c[2]])].join(' ');if(!q||text.toLowerCase().includes(q))results.push({kind:'Topic',title:t.title,desc:t.lead,route:t.id})});pages.forEach(p=>{let all=[p.title,p.desc,p.tags.join(' '),...p.blocks.flatMap(b=>[b.heading,...b.items])].join(' ');if(q&&all.toLowerCase().includes(q)){const primary=topics.find(t=>t.sourceIds.includes(p.id))||topics.find(t=>t.extraIds.includes(p.id));results.push({kind:'Notion source',title:p.title,desc:p.desc,route:primary?.id||'library',tab:'来源'})}});$('#search-results').innerHTML=results.slice(0,30).map(x=>`<div class="result" data-goresult="${es(x.route)}|${es(x.tab||'')}"><b>${es(x.title)}</b><small>${es(x.kind)} · ${es(x.desc.slice(0,150))}</small></div>`).join('')||'<div class="empty">没有匹配内容</div>'}
function exportNotes(){let blob=new Blob([JSON.stringify({generated:'2026-10-26',saved_at:new Date().toISOString(),notes:state.notes,checked:state.checked},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='openai-atlas-notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
document.addEventListener('click',e=>{let x=e.target.closest('[data-route]');if(x){setRoute(x.dataset.route);return}x=e.target.closest('[data-goto]');if(x){let [r,t]=x.dataset.goto.split('|');setRoute(r,t);return}x=e.target.closest('[data-topic-tab]');if(x){let [r,tab]=x.dataset.topicTab.split('|');state.tab[r]=tab;if(state.route!==r){setRoute(r,tab)}else{location.hash='#/'+r+'/'+encodeURIComponent(tab);render();window.scrollTo({top:0,behavior:'smooth'})}return}x=e.target.closest('[data-role]');if(x){setState('role',x.dataset.role);return}x=e.target.closest('[data-step]');if(x){setState('step',Number(x.dataset.step));return}x=e.target.closest('[data-sector-sort]');if(x){state.sortSectors=state.sortSectors==='desc'?'asc':'desc';render();return}x=e.target.closest('[data-flip]');if(x){state.flip=!state.flip;render();return}x=e.target.closest('[data-flash-prev]');if(x){flashChange(-1);return}x=e.target.closest('[data-flash-next]');if(x){flashChange(1);return}x=e.target.closest('[data-flash-check]');if(x){state.checked['q'+state.flash]=!state.checked['q'+state.flash];save();render();return}x=e.target.closest('[data-edge-filter]');if(x){setState('edgeFilter',x.dataset.edgeFilter);return}x=e.target.closest('[data-node]');if(x){setState('graph',x.dataset.node);return}x=e.target.closest('[data-person]');if(x){state.graph=x.dataset.person;state.tab.people='关系网络';render();return}x=e.target.closest('[data-partner-filter]');if(x){setState('partnerFilter',x.dataset.partnerFilter);return}x=e.target.closest('[data-scroll]');if(x){document.getElementById(x.dataset.scroll)?.scrollIntoView({behavior:'smooth',block:'start'});return}x=e.target.closest('[data-goresult]');if(x){search(false);let [r,t]=x.dataset.goresult.split('|');setRoute(r,t||undefined);return}x=e.target.closest('[data-export]');if(x){exportNotes();return}if(e.target===$('#search-layer')){search(false);return}});
document.addEventListener('change',e=>{if(e.target.id==='personcategory'){state.personFilter=e.target.value;render()}else if(e.target.id==='companycategory'){state.companyFilter=e.target.value;render()}else if(e.target.matches('[data-check]')){state.checked[e.target.dataset.check]=e.target.checked;save();render()}});
document.addEventListener('input',e=>{if(e.target.id==='personsearch'){state.personTerm=e.target.value;let focus=e.target.selectionStart;render();let n=$('#personsearch');n?.focus();n?.setSelectionRange(focus,focus)}else if(e.target.id==='companysearch'){state.companyTerm=e.target.value;let focus=e.target.selectionStart;render();let n=$('#companysearch');n?.focus();n?.setSelectionRange(focus,focus)}else if(e.target.matches('[data-note]')){state.notes[e.target.dataset.note]=e.target.value;save()}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search(!$('#search-layer').classList.contains('open'))}if(e.key==='Escape')search(false);if(e.key==='Enter'&&e.target.matches('.flashcard,[role="button"].topic-card')){e.target.click()} });$('#searchbtn').onclick=()=>search(true);$('#search-input').addEventListener('input',e=>searchResults(e.target.value));$('#search-input').addEventListener('keydown',e=>{if(e.key==='Enter'){let r=$('#search-results .result');r?.click()}});$('#themebtn').onclick=()=>{state.theme=!state.theme;document.body.classList.toggle('dark',state.theme);store.put('atlas-v2-theme',state.theme?'dark':'light')};$('#mobilemenu').onclick=()=>$('#sidebar').classList.add('open');$('#closemenu').onclick=()=>$('#sidebar').classList.remove('open');document.body.classList.toggle('dark',state.theme);window.addEventListener('hashchange',()=>{let prev=state.route;let prior=topicMap[prev]?selectedTab(topicMap[prev]):'';parseHash();if(prev!==state.route||(topicMap[state.route]&&prior!==selectedTab(topicMap[state.route])))render()});parseHash();if(!topicMap[state.route]&&!['home','library','workspace'].includes(state.route))state.route='home';render();
})();
</script></body></html>
